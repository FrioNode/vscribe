# fly.toml app configuration file generated for transcribe on 2026-05-29T14:32:18+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'transcribe'
primary_region = 'jnb'

[build]


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  PYTHON_SERVICE_URL = "http://localhost:8000"
  DB_PATH = "/data/transcribe.db"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
