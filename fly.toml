app = "vscribe"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  PYTHON_SERVICE_URL = "http://localhost:8000"
  REDIS_HOST = "localhost"
  REDIS_PORT = "6379"
  REDIS_PASSWORD = "node"
  DB_PATH = "/data/transcribe.db"
  WHISPER_MODEL = "base"

[[services]]
  internal_port = 3000
  protocol = "tcp"

[[services.ports]]
  port = 80
  handlers = ["http"]

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[mounts]
  source = "vscribe_data"
  destination = "/data"

[mounts]
  source = "vscribe_cache"
  destination = "/app/cache/transcriptions"
